<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Remote Thermostat</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/theme.js"></script>
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <header class="top">
      <h1>Remote Thermostat</h1>
      <span id="session-label" class="session-label"></span>
      <button id="login-open" class="link" type="button">Sign in</button>
      <button id="logout" class="link" type="button" hidden>Sign out</button>
      <button id="settings-open" class="gear" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"
          />
        </svg>
      </button>
    </header>

    <main id="main" tabindex="-1">
      <div id="demo-banner" class="banner" hidden>
        <span>Demo — sample data, nothing is sent.</span
        ><button id="exit-demo" class="link" type="button">Exit</button>
      </div>
      <p id="notice" class="notice" role="status" aria-live="polite">
        <span id="notice-text"></span>
        <button id="start-demo" class="link" type="button">Try demo</button>
      </p>

      <section class="card" aria-label="Temperature">
        <div class="row">
          <span id="dial-label" class="muted">Target</span>
          <span id="connection-badge" class="badge"
            ><span id="connection-label">Not connected</span></span
          >
        </div>
        <div id="dial" class="dial" data-mode="disconnected">
          <div class="dial-number" aria-live="polite" aria-atomic="true">
            <span id="target-value">—</span><span id="target-unit" class="dial-unit">°C</span>
          </div>
          <span id="dial-description" class="muted"></span>
        </div>
        <div id="stepper" class="stepper">
          <button id="temperature-down" type="button" class="step" aria-label="Lower" disabled>
            −
          </button>
          <span id="stepper-hint" class="muted"></span>
          <button id="temperature-up" type="button" class="step" aria-label="Raise" disabled>
            +
          </button>
        </div>
        <div id="range-controls" class="range" hidden>
          <label
            >Heat
            <span
              ><input id="range-heat" type="number" inputmode="decimal" step="0.5" /><span
                class="range-unit"
                >°C</span
              ></span
            ></label
          >
          <label
            >Cool
            <span
              ><input id="range-cool" type="number" inputmode="decimal" step="0.5" /><span
                class="range-unit"
                >°C</span
              ></span
            ></label
          >
        </div>
        <button id="apply-temperature" type="button" class="primary wide" disabled>Apply</button>
        <div class="row readings">
          <span>Inside <strong id="ambient-value">—</strong></span>
          <span>Humidity <strong id="humidity-value">—</strong></span>
        </div>
        <div class="row">
          <span id="sync-status" class="muted small"></span>
          <button id="refresh" class="link small" type="button">Refresh</button>
        </div>
      </section>

      <section class="card" aria-labelledby="mode-title">
        <h2 id="mode-title">Mode</h2>
        <div id="mode-buttons" class="segmented" role="group" aria-label="Mode">
          <button type="button" disabled>Heat</button><button type="button" disabled>Off</button>
        </div>
        <div id="eco-controls" class="row" hidden>
          <span>Eco <span id="eco-description" class="muted small"></span></span>
          <button
            id="eco-toggle"
            class="toggle"
            type="button"
            aria-pressed="false"
            aria-label="Eco"
          >
            <span></span>
          </button>
        </div>
        <p id="eco-readings" class="muted small" hidden></p>
      </section>

      <section id="admin-card" class="card" aria-labelledby="admin-title" hidden>
        <div class="row">
          <h2 id="admin-title">User access</h2>
          <input id="user-enabled" type="checkbox" class="switch" aria-label="User access on" />
        </div>
        <fieldset class="setting-group">
          <legend>Modes</legend>
          <label><input type="checkbox" data-mode-choice="HEAT" /> Heat</label>
          <label><input type="checkbox" data-mode-choice="COOL" /> Cool</label>
          <label><input type="checkbox" data-mode-choice="HEATCOOL" /> Heat/Cool</label>
          <label><input type="checkbox" data-mode-choice="OFF" /> Off</label>
          <label><input id="user-eco" type="checkbox" /> Eco</label>
        </fieldset>
        <div class="range">
          <label
            >Lowest
            <span
              ><input id="user-min" type="number" inputmode="decimal" step="0.5" /><span
                class="admin-unit"
                >°C</span
              ></span
            ></label
          >
          <label
            >Highest
            <span
              ><input id="user-max" type="number" inputmode="decimal" step="0.5" /><span
                class="admin-unit"
                >°C</span
              ></span
            ></label
          >
        </div>
        <p id="admin-status" class="muted small"></p>
      </section>
    </main>

    <dialog id="settings-dialog" aria-labelledby="settings-title">
      <div>
        <div class="row">
          <h2 id="settings-title">Settings</h2>
          <button id="settings-close" class="close" type="button" aria-label="Close">×</button>
        </div>
        <div class="setting">
          <span>Theme</span>
          <div id="theme-control" class="unit-control" role="group" aria-label="Theme">
            <button type="button" data-theme-choice="system">Auto</button
            ><button type="button" data-theme-choice="light">Light</button
            ><button type="button" data-theme-choice="dark">Dark</button>
          </div>
        </div>
        <div class="setting">
          <span>Units</span>
          <div class="unit-control" role="group" aria-label="Units">
            <button id="unit-c" type="button" aria-pressed="true">°C</button
            ><button id="unit-f" type="button" aria-pressed="false">°F</button>
          </div>
        </div>
      </div>
    </dialog>
    <dialog id="login-dialog" aria-labelledby="login-title">
      <form id="login-form">
        <div class="row">
          <h2 id="login-title">Sign in</h2>
          <button class="close" id="login-close" type="button" aria-label="Close">×</button>
        </div>
        <label for="access-key">Code</label
        ><input
          id="access-key"
          type="password"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          required
          maxlength="256"
        />
        <p id="login-error" class="error" role="alert" hidden></p>
        <button id="login-submit" type="submit" class="primary wide">Sign in</button>
      </form>
    </dialog>
    <dialog id="confirm-dialog" aria-labelledby="confirm-title">
      <div>
        <div class="row">
          <h2 id="confirm-title">Confirm</h2>
          <button id="confirm-close" class="close" type="button" aria-label="Cancel">×</button>
        </div>
        <p id="confirm-description"></p>
        <div class="actions">
          <button id="confirm-cancel" type="button">Cancel</button
          ><button id="confirm-apply" type="button" class="primary">Confirm</button>
        </div>
      </div>
    </dialog>
    <noscript><p class="notice">JavaScript is required.</p></noscript>
  </body>
</html>
