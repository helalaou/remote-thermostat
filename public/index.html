<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Remote Thermostat</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <header class="top">
      <h1>Remote Thermostat</h1>
      <span id="session-label" class="session-label"></span>
      <div class="unit-control" role="group" aria-label="Units">
        <button id="unit-c" type="button" aria-pressed="true">°C</button
        ><button id="unit-f" type="button" aria-pressed="false">°F</button>
      </div>
      <button id="login-open" class="link" type="button">Sign in</button>
      <button id="logout" class="link" type="button" hidden>Sign out</button>
    </header>

    <main id="main" tabindex="-1">
      <div id="demo-banner" class="banner" hidden>
        <span>Demo — sample data, nothing is sent.</span
        ><button id="exit-demo" class="link" type="button">Exit</button>
      </div>
      <p id="notice" class="notice" role="status" aria-live="polite">
        <span id="notice-text"></span>
        <button id="start-demo" class="link" type="button">Try demo</button>
      </p>

      <section class="card" aria-label="Temperature">
        <div class="row">
          <span id="dial-label" class="muted">Target</span>
          <span id="connection-badge" class="badge"
            ><span id="connection-label">Not connected</span></span
          >
        </div>
        <div id="dial" class="dial" data-mode="disconnected">
          <div class="dial-number" aria-live="polite" aria-atomic="true">
            <span id="target-value">—</span><span id="target-unit" class="dial-unit">°C</span>
          </div>
          <span id="dial-description" class="muted"></span>
        </div>
        <div id="stepper" class="stepper">
          <button id="temperature-down" type="button" class="step" aria-label="Lower" disabled>
            −
          </button>
          <span id="stepper-hint" class="muted"></span>
          <button id="temperature-up" type="button" class="step" aria-label="Raise" disabled>
            +
          </button>
        </div>
        <div id="range-controls" class="range" hidden>
          <label
            >Heat
            <span
              ><input id="range-heat" type="number" inputmode="decimal" step="0.5" /><span
                class="range-unit"
                >°C</span
              ></span
            ></label
          >
          <label
            >Cool
            <span
              ><input id="range-cool" type="number" inputmode="decimal" step="0.5" /><span
                class="range-unit"
                >°C</span
              ></span
            ></label
          >
        </div>
        <button id="apply-temperature" type="button" class="primary wide" disabled>Apply</button>
        <div class="row readings">
          <span>Inside <strong id="ambient-value">—</strong></span>
          <span>Humidity <strong id="humidity-value">—</strong></span>
        </div>
        <div class="row">
          <span id="sync-status" class="muted small"></span>
          <button id="refresh" class="link small" type="button">Refresh</button>
        </div>
      </section>

      <section class="card" aria-labelledby="mode-title">
        <h2 id="mode-title">Mode</h2>
        <div id="mode-buttons" class="segmented" role="group" aria-label="Mode">
          <button type="button" disabled>Heat</button><button type="button" disabled>Off</button>
        </div>
        <div id="eco-controls" class="row" hidden>
          <span>Eco <span id="eco-description" class="muted small"></span></span>
          <button
            id="eco-toggle"
            class="toggle"
            type="button"
            aria-pressed="false"
            aria-label="Eco"
          >
            <span></span>
          </button>
        </div>
        <p id="eco-readings" class="muted small" hidden></p>
      </section>

      <section id="fan-card" class="card" aria-labelledby="fan-title" hidden>
        <h2 id="fan-title">Fan</h2>
        <p id="fan-description" class="muted small"></p>
        <div class="inline">
          <label class="sr-only" for="fan-duration">Duration</label
          ><select id="fan-duration">
            <option value="900">15 min</option>
            <option value="1800">30 min</option>
            <option value="3600">1 hour</option>
            <option value="7200">2 hours</option>
            <option value="14400">4 hours</option>
            <option value="28800">8 hours</option>
            <option value="43200">12 hours</option></select
          ><button id="fan-start" type="button">Run</button
          ><button id="fan-stop" type="button" hidden>Stop</button>
        </div>
      </section>

      <section id="owner-card" class="card" aria-labelledby="owner-title" hidden>
        <h2 id="owner-title">Access</h2>
        <div id="access-list" class="access-list"></div>
        <form id="key-form" class="inline">
          <label class="sr-only" for="key-label">Name</label
          ><input id="key-label" maxlength="80" placeholder="Name" required autocomplete="off" />
          <label class="sr-only" for="key-days">Expires</label
          ><select id="key-days">
            <option value="1">1 day</option>
            <option value="7">7 days</option>
            <option value="30" selected>30 days</option>
            <option value="90">90 days</option>
            <option value="365">1 year</option></select
          ><button id="key-create" type="submit">Add</button>
        </form>
        <div id="key-created" class="key-created" hidden>
          <p class="small">Copy this key now. It won't be shown again.</p>
          <div class="inline">
            <input id="key-token" readonly aria-label="New access key" /><button
              id="key-copy"
              type="button"
            >
              Copy
            </button>
          </div>
        </div>
        <h2>Google Nest</h2>
        <p id="owner-description" class="muted small"></p>
        <button id="google-connect" type="button" disabled>Connect Google Nest</button>
      </section>
    </main>

    <dialog id="login-dialog" aria-labelledby="login-title">
      <form id="login-form">
        <div class="row">
          <h2 id="login-title">Sign in</h2>
          <button class="close" id="login-close" type="button" aria-label="Close">×</button>
        </div>
        <label for="access-key">Access key</label
        ><input
          id="access-key"
          type="password"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          required
          maxlength="256"
        />
        <p id="login-error" class="error" role="alert" hidden></p>
        <button id="login-submit" type="submit" class="primary wide">Sign in</button>
      </form>
    </dialog>
    <dialog id="confirm-dialog" aria-labelledby="confirm-title">
      <div>
        <div class="row">
          <h2 id="confirm-title">Confirm</h2>
          <button id="confirm-close" class="close" type="button" aria-label="Cancel">×</button>
        </div>
        <p id="confirm-description"></p>
        <div class="actions">
          <button id="confirm-cancel" type="button">Cancel</button
          ><button id="confirm-apply" type="button" class="primary">Confirm</button>
        </div>
      </div>
    </dialog>
    <noscript><p class="notice">JavaScript is required.</p></noscript>
  </body>
</html>
